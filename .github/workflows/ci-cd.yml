name: RetailPulse Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-gate:
    name: Backend Lint, Security, Tests & Disaster Recovery
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit

    - name: Security Scanning (Bandit)
      run: |
        bandit -r backend src -ll -ii || true

    - name: Syntax & Lint Verification
      run: |
        flake8 backend src tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Full Pytest Suite (61+ Tests)
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Verify Automated Disaster Recovery Backup & Restore
      run: |
        python scripts/backup_database.py
        python scripts/restore_database.py --dry-run

  frontend-quality-gate:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: TypeScript Check & Vite Build
      working-directory: frontend
      run: npm run build

  container-build-gate:
    name: Production Container Build & Health Validation
    needs: [backend-quality-gate, frontend-quality-gate]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Docker Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: retailpulse:3.2.0-production
